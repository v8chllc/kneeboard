# CodeRabbit is the independent review gate for every section pull request.
# See docs/build-execution-strategy.md, "Mandatory independent review".
#
# This file must exist on the feature branch being reviewed; CodeRabbit reads it
# from the head branch, not from main.

language: en-US

tone_instructions: >-
  Be direct and factual. Skip praise and preamble. Kneeboard is a home
  flight-simulation aid and must never be described or treated as an approved
  real-world navigation tool.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  collapse_walkthrough: true
  poem: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    drafts: false

  # Sanitized fixtures are generated by scripts/sanitize_simbrief_fixture.py and
  # reviewed by regenerating them, not by reading the JSON. The wireframe is a
  # throwaway reference drawing that is deliberately not carried into
  # application code.
  path_filters:
    - "!tests/fixtures/simbrief/*.json"
    - "!docs/prototypes/tracker-wireframe.html"
    - "!.remember/**"
    - "!pnpm-lock.yaml"

  path_instructions:
    - path: "src/domain/**"
      instructions: >-
        This layer must stay framework-independent: no React, Next.js, database,
        or network imports. Check tracker rules against the domain invariants in
        AGENTS.md and docs/tracker-behavior.md, especially deferred slot release
        (the most recently passed fix keeps its slot), cascading Pass, terminal
        Skip, slot renumbering only on Skip and SID/STAR changes, and the
        sliding window changing membership only on Save. Transitions must be
        pure and deterministic.

    - path: "src/app/**"
      instructions: >-
        This is the Next.js App Router layer. Tracker rules belong in
        src/domain/ and must be called from here, never reimplemented. Keep the
        simulation-only warning visible in user-facing output: Kneeboard is a
        home flight-simulation aid and is never an approved real-world
        navigation tool. Keep the interface dark and high-contrast, and format
        timestamps in UTC using aviation-style formatting. Never leak server
        secrets, raw OFPs, or Pilot IDs into client components or markup.

    - path: "src/**"
      instructions: >-
        Flag any tracker rule reimplemented outside src/domain/. Every
        account-scoped read and mutation needs an adjacent server-side
        authorization check. Never log raw OFPs, coordinates, Pilot IDs, email
        addresses, sessions, or magic-link tokens. External responses, persisted
        JSON, request payloads, and environment configuration are untrusted and
        must be validated with Zod.

    - path: "**/*.test.ts"
      instructions: >-
        Tests must use the sanitized fixtures under tests/fixtures/simbrief and
        must never contact live SimBrief, Resend, or production infrastructure.
        Flag any weakened assertion that makes a failing gate pass.

    - path: "tests/tooling/**"
      instructions: >-
        These tests exist only to prove the test command is operational. Keep
        them minimal and free of network access. Flag domain or application
        behavior being tested here instead of alongside the code it covers.

    - path: ".github/workflows/**"
      instructions: >-
        Workflows must run the same canonical commands documented in README.md
        and defined in package.json, with no CI-only variants. Node and pnpm
        come from the checked-in mise.toml, so flag any version pinned a second
        time in YAML. Every third-party action must be pinned to a full
        immutable commit SHA with the human-readable version in a trailing
        comment. Keep permissions least-privilege. CI must never contact live
        SimBrief, Resend, or production infrastructure, and must never run a
        production migration or deployment.

    - path: "scripts/**"
      instructions: >-
        These handle raw SimBrief payloads containing personal account data.
        Verify the sanitizer keeps its allowlisting approach and that no raw
        payload path is written anywhere tracked by Git.

    - path: "docs/**"
      instructions: >-
        These are governing decision documents, not scratch notes. Flag a change
        that alters a recorded decision to match code rather than the reverse,
        and flag any new statement that conflicts with an existing decision.

  # Confirmed against the real stack: eslint.config.mjs is an ESLint 9 flat
  # config composing eslint-config-next core-web-vitals and typescript, ruff
  # covers the two Python scripts under scripts/, and actionlint now has a real
  # workflow to check at .github/workflows/ci.yml.
  tools:
    gitleaks:
      enabled: true
    ruff:
      enabled: true
    eslint:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    # Disabled: the prose documents wrap at 80 columns by hand and use long
    # table rows, which default markdownlint rules report as violations.
    markdownlint:
      enabled: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "docs/product-decisions.md"
      - "docs/tracker-behavior.md"
      - "docs/technical-decisions.md"
      - "docs/build-execution-strategy.md"

# Runs the canonical local commands from README.md with no CI-only variants.
# Node and pnpm come from the checked-in mise.toml, so the pins are not
# duplicated here. Third-party actions are pinned to immutable commit SHAs.

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:29e0bb09c8e7e7fc265ea9f4367de9622e55bae6b0b97e7cce740c2d63c2ebc0
        env:
          POSTGRES_USER: kneeboard
          POSTGRES_PASSWORD: local_only_kneeboard
          POSTGRES_DB: kneeboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kneeboard -d kneeboard_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step needs authenticated Git access, so the job token is
          # not left behind in the local Git configuration.
          persist-credentials: false

      - name: Install the pinned toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Migrate test database
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://kneeboard:local_only_kneeboard@127.0.0.1:5432/kneeboard_test

      - name: Integration tests
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://kneeboard:local_only_kneeboard@127.0.0.1:5432/kneeboard_test

      - name: Build
        run: pnpm build

services:
  postgres:
    image: postgres:17@sha256:29e0bb09c8e7e7fc265ea9f4367de9622e55bae6b0b97e7cce740c2d63c2ebc0
    environment:
      POSTGRES_USER: kneeboard
      POSTGRES_PASSWORD: local_only_kneeboard
      POSTGRES_DB: kneeboard_dev
    ports:
      - "127.0.0.1:${KNEEBOARD_DB_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/local-db-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U kneeboard -d kneeboard_dev -Atqc 'SELECT 1' >/dev/null && PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U kneeboard -d kneeboard_test -Atqc 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 15
  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports:
      - "127.0.0.1:${KNEEBOARD_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${KNEEBOARD_MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres_data:
